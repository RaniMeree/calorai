# Render Blueprint: static site built with Next.js "output: export" into out/.
services:
  - type: web
    name: calor-ai-website
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "24"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Invite links: calor-ai.com/i/<id> -> backend, which logs the click and opens the store
      - type: redirect
        source: /i/*
        destination: https://fullstack-ff1a.onrender.com/i/*
